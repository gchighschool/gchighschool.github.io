<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>নোটিশ — ঘোনার চালা উচ্চ বিদ্যালয়</title>
  <!-- Old notice links looked like notice-view.html?id=3 (shared on Facebook, etc.).
       They now live at notices/3.html. Anything we cannot map goes to the notice list. -->
  <script>
    (function () {
      var m = /[?&]id=([^&#]*)/.exec(window.location.search);
      var id = m ? decodeURIComponent(m[1]) : '';
      var ok = /^[A-Za-z0-9_-]+$/.test(id);
      window.location.replace(ok ? 'notices/' + id + '.html' : 'notices.html');
    }());
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=notices.html"></noscript>
</head>
<body>
  <p><a href="notices.html">নোটিশ বোর্ডে যান</a></p>
</body>
</html>
